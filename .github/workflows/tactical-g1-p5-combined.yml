name: Tactical G1 P5 Combined Gameplay Gate
on:
  pull_request:
    paths:
      - 'tools/verify_tactical_g1_p5_vertical_proof.mjs'
      - 'tactical-ops-src/**'
      - 'tools/verify_tactical_g1_fieldcraft.mjs'
      - 'tools/verify_tactical_g1_transactions.mjs'
      - 'tools/verify_tactical_battlefield_p5.mjs'
      - 'tools/verify_tactical_vnext_run_contract_wire.mjs'
      - 'js/tactical_ops.js'
      - 'js/boot_loaders.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tactical-g1-p5-combined.yml'
permissions:
  contents: read
jobs:
  gameplay-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Versioned growth + genuine decision director + accepted-run wire
        run: node tools/verify_tactical_g1_p5_vertical_proof.mjs
      - name: Production IIFE parity
        run: |
          npm run build:tactical-ops
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
