name: Echo HQ P0.2 Verify
on:
  push:
    branches: [faction-hq-echo-p02-layout-closure]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax
        run: |
          node --check js/faction_hq.js
          node --check js/faction_hq_living_p0.js
      - name: Layout contract
        run: |
          grep -q 'P0.2 — FRONT / PACK premium shell closure' css/faction_hq_living_p0.css
          grep -q 'position:fixed!important' css/faction_hq_living_p0.css
          grep -q 'data-hq-view="pack"' css/faction_hq_living_p0.css
