name: Tactical accepted Foundation grid

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "tactical-ops-src/host/foundationProgression.ts"
      - "tactical-ops-src/store/battleStore.ts"
      - "tactical-ops-src/ui/Battle.tsx"
      - "tactical-ops-src/version.ts"
      - "js/tactical_ops.js"
      - "js/boot_loaders.js"
      - "tools/verify_tactical_accepted_foundation_grid.mjs"
      - "tools/verify_tactical_foundation_character_bridge.mjs"
      - "tactical-ops-src/combat/combatProfileV3.ts"
      - ".github/workflows/tactical-accepted-foundation-grid.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node tools/verify_tactical_accepted_foundation_grid.mjs
      - run: node tools/verify_tactical_foundation_character_bridge.mjs
      - run: node tools/verify_tactical_vnext_run_contract_wire.mjs
      - run: node tools/benchmark_tactical_vnext_grids.mjs
      - run: npm run build:tactical-ops
      - run: node --check js/tactical_ops.js
      # One-off review-branch bundle sync. Remove after the generated files are committed.
      - name: Sync built bundle to Foundation Bridge review branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tactical-foundation-character-bridge-v1-20261109' }}
        run: |
          git fetch origin fix/tactical-foundation-character-bridge-v1-20261109
          git checkout -B fix/tactical-foundation-character-bridge-v1-20261109 origin/fix/tactical-foundation-character-bridge-v1-20261109
          npm run build:tactical-ops
          if ! git diff --quiet -- js/tactical_ops.js js/boot_loaders.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/tactical_ops.js js/boot_loaders.js
            git commit -m "build(tactical): sync Foundation Bridge production bundle"
            git push origin HEAD:refs/heads/fix/tactical-foundation-character-bridge-v1-20261109
          fi
