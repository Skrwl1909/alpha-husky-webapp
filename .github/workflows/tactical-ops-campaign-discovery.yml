name: Tactical Ops campaign discovery PR
on:
  push:
    branches: [fix/tactical-war-table-campaign-first-20261011]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tactical-war-table-campaign-first-20261011
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/verify_tactical_ops_campaign_discovery.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build:tactical-ops
      - run: |
          test -s js/tactical_ops.js
          node --check js/tactical_ops.js
          grep -q 'v3.1.3-campaign-discovery' js/tactical_ops.js
      - name: Add rebuilt bundle to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(tactical): campaign-first runtime [skip ci]"
          git push origin HEAD:fix/tactical-war-table-campaign-first-20261011
