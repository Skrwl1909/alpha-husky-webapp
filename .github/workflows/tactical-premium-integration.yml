name: Tactical Premium Combined Integration
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'js/pet_quick_actions.js'
      - 'tools/verify_tactical_*integration.mjs'
      - 'tools/verify_tactical_brief_closure_browser.mjs'
      - '.github/workflows/tactical-premium-integration.yml'
permissions:
  contents: read
jobs:
  integrated-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Preserve both source PRs and compiled features
        run: node tools/verify_tactical_premium_integration.mjs
      - name: Coherent canonical production build
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          node --check js/pet_quick_actions.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Production Brief to Results to Next and Replay with global pet overlay
        run: BRIEF_INTEGRATED=1 BRIEF_PRODUCTION=1 node tools/verify_tactical_brief_closure_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-integrated-mobile-evidence
          path: artifacts/brief-closure/after-production
          if-no-files-found: error
