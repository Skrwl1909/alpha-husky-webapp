name: Tactical Premium Combined Integration
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'js/pet_quick_actions.js'
      - 'tools/verify_tactical_*integration.mjs'
      - 'tools/verify_tactical_brief_closure_browser.mjs'
      - '.github/workflows/tactical-premium-integration.yml'
permissions:
  contents: read
jobs:
  integrated-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Carrier Jam routes and extraction rules
        run: node tools/verify_tactical_carrier_jam.mjs
      - name: Preserve both source PRs and compiled features
        run: node tools/verify_tactical_premium_integration.mjs
      - name: Coherent canonical production build
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          node --check js/pet_quick_actions.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Blood Scent workers and mobile purchase
        run: |
          mkdir -p artifacts/legacy-blood-scent
          git archive 9f0d2a34 tactical-ops-src tools/build_tactical_m2_workers.mjs tools/tactical_recover_engine_v1.ts tools/tactical_last_howl_engine_v11.ts | tar -x -C artifacts/legacy-blood-scent
          node artifacts/legacy-blood-scent/tools/build_tactical_m2_workers.mjs artifacts/blood-scent-workers blood_scent_v1
          node tools/verify_tactical_blood_scent.mjs
          node tools/verify_tactical_signal_atlas_default_browser.mjs
        env:
          ATLAS_BLOOD_SCENT_ONLY: '1'
          ATLAS_DEFAULT_ACTIONS_ONLY: '1'
          ATLAS_DEFAULT_OUT: artifacts/blood-scent
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Pack Link workers and positional purchase
        run: |
          node tools/build_tactical_m2_workers.mjs artifacts/pack-link-workers pack_link_v1
          cp artifacts/blood-scent-workers/*.cjs artifacts/pack-link-workers/
          node tools/verify_tactical_pack_link.mjs
          node tools/verify_tactical_signal_atlas_default_browser.mjs
        env:
          ATLAS_PACK_LINK_ONLY: '1'
          ATLAS_DEFAULT_ACTIONS_ONLY: '1'
          ATLAS_DEFAULT_OUT: artifacts/pack-link
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Production Brief to Results to Next and Replay with global pet overlay
        run: BRIEF_INTEGRATED=1 BRIEF_PRODUCTION=1 node tools/verify_tactical_brief_closure_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Last Howl visible touch controls and abandon confirmation
        run: node tools/verify_tactical_last_howl_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-integrated-mobile-evidence
          path: |
            artifacts/brief-closure/after-production
            artifacts/command-deck-v2
            artifacts/blood-scent
            artifacts/pack-link
          if-no-files-found: error
