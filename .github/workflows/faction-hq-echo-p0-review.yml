name: Faction HQ Echo P0 Review
on:
  push:
    branches: [faction-hq-premium-echo-p0]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax
        run: |
          node --check js/faction_hq.js
          node --check js/faction_hq_living_p0.js
      - name: Contract
        run: |
          grep -q 'ah:faction-hq-rendered' js/faction_hq.js
          grep -q 'CURRENT FRONT' js/faction_hq_living_p0.js
          grep -q 'echo_wardens_80.webp' js/faction_hq_living_p0.js
          grep -q 'echo_wardens_hq_frame01.webp' css/faction_hq_living_p0.css
          grep -q 'faction_hq_living_p0.js' index.html
