name: Tactical premium canonical build
on:
  push:
    branches:
      - tactical-ops-premium-presentation-pass
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tactical-ops-premium-presentation-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:tactical-ops
      - name: Verify presentation bundle
        run: |
          grep -F "tactical_ops.js v3.1.0-premium-presentation" js/tactical_ops.js
          grep -F 'global.WEBAPP_VER = "tops-3.1.0-premium-presentation";' js/boot_loaders.js
          grep -F "TODAY'S FRONT" js/tactical_ops.js
          grep -F "SIGNAL RECOVERY" js/tactical_ops.js
          grep -F "HOLD THE LINE" js/tactical_ops.js
          grep -F "ENDURE" js/tactical_ops.js
      - name: Commit canonical bundle and remove temporary workflow
        run: |
          git config user.name "alpha-husky-build"
          git config user.email "actions@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          git rm .github/workflows/tactical-premium-build.yml
          git commit -m "Tactical Ops presentation: canonical v3.1 bundle"
          git push origin HEAD:tactical-ops-premium-presentation-pass
