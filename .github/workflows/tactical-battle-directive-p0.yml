name: Tactical battle directive P0
on:
  pull_request:
    paths:
      - "tactical-ops-src/ui/Battle.tsx"
      - "tactical-ops-src/version.ts"
      - "js/tactical_ops.js"
      - "js/boot_loaders.js"
      - "tools/verify_tactical_battle_directive_p0.mjs"
      - ".github/workflows/tactical-battle-directive-p0.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build:tactical-ops
      - run: node tools/verify_tactical_battle_directive_p0.mjs
      - run: node --check js/tactical_ops.js
