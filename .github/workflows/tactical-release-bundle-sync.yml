name: Tactical release bundle sync
on:
  pull_request:
    paths:
      - "tactical-ops-src/version.ts"
      - ".github/workflows/tactical-release-bundle-sync.yml"
permissions:
  contents: write
jobs:
  bundle:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build:tactical-ops
      - name: Verify shipped bundle and version
        run: |
          node --check js/tactical_ops.js
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const b=readFileSync('js/tactical_ops.js','utf8');
          const l=readFileSync('js/boot_loaders.js','utf8');
          assert(b.includes('tactical_ops.js v3.1.5-p2-mobile'));
          assert(b.includes('max-height: 92px'), 'missing merged mobile HUD fix');
          assert(b.includes('.t-results .t-id-card'), 'missing result portrait fix');
          assert(b.includes('reinforced SIGNAL COURIER'), 'missing PR135 gameplay');
          assert(l.includes('tops-3.1.5-p2-mobile'), 'stale loader cache');
          console.log('PASS: version, gameplay, iOS HUD, results, loader');
          EOF
      - name: Commit generated release artifacts to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git commit -m "build(tactical): ship P2 and mobile fixes in generated IIFE"
            git push
          fi
