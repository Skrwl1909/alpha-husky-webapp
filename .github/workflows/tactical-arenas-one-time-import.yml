name: Tactical Arena Assets — One-Time Verified Import
on:
  push:
    branches:
      - feat/tactical-overhead-perspective-v1
permissions:
  contents: write
jobs:
  import-approved-art:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch exact user-approved original images and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arena-sources
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KEwEdRKzfZliIoXNpVQ0ObfnKb/fccb4f5b-f6fa-41fc-934b-749e3e156e78.png' -o /tmp/arena-sources/broken_signal.png
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KEwEdRKzfZliIoXNpVQ0ObfnKb/c1d282d8-3848-40d8-be28-2f46b6d91d3a.png' -o /tmp/arena-sources/dead_relay.png
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KEwEdRKzfZliIoXNpVQ0ObfnKb/a85f5b31-7aa3-48ae-a051-2e903e851a7a.png' -o /tmp/arena-sources/field_ops.png
          echo '379ebabc72fdd685e566e8deb45cbc13149dd265460020e6fb2b72133ea4d730  /tmp/arena-sources/broken_signal.png' | sha256sum -c -
          echo '62dcb0f82269bc836f579211e274e58cf5c74deb3248233fe869aa29dd8a0de9  /tmp/arena-sources/dead_relay.png' | sha256sum -c -
          echo '2102841265c9a67d5298360b156c4a5b356f61f0948ef9c1164de75034199cdc  /tmp/arena-sources/field_ops.png' | sha256sum -c -
      - name: Produce three 900x1600 WebP masters with exact scene identity
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          dst=Path('images/tactical_ops/battlefields')
          dst.mkdir(parents=True,exist_ok=True)
          for name in ('broken_signal','dead_relay','field_ops'):
              img=Image.open('/tmp/arena-sources/'+name+'.png').convert('RGB')
              assert img.size[0]==941 and img.size[1] in (1671,1672), (name,img.size)
              img=img.resize((900,1600),Image.Resampling.LANCZOS)
              target=dst/('battlefield_'+name+'_mobile.webp')
              img.save(target,'WEBP',quality=84,method=6)
              with Image.open(target) as check:
                  assert check.size==(900,1600) and check.format=='WEBP'
              print(name, target, target.stat().st_size)
          PY
      - name: Commit verified images to PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/tactical_ops/battlefields/battlefield_*_mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(tactical): add three verified original overhead battlefields [skip ci]"
            git push origin HEAD:feat/tactical-overhead-perspective-v1
          fi
