name: Build Tactical Battlefield Lab bundle
on:
  push:
    branches:
      - feat/tactical-battlefield-live-test-access-20261019
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tactical-battlefield-live-test-access-20261019
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify authenticated-client Battlefield Lab flag and all twelve missions
        run: node tools/verify_tactical_battlefield_preview.mjs
      - name: Verify current legacy battle regression
        run: node tools/simulate_tactical_vnext_step0_legacy.mjs
      - name: Build production Tactical Ops IIFE and versioned loader
        run: npm run build:tactical-ops
      - name: Confirm bundle contains newly built lab
        run: |
          grep -q 'v3.1.6-battlefield-lab' js/tactical_ops.js
          grep -q 'tops-3.1.6-battlefield-lab' js/boot_loaders.js
      - name: Commit generated bundle to the SAME PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tactical_ops.js js/boot_loaders.js
          if git diff --cached --quiet; then
            echo 'Bundle already matches source.'
          else
            git commit -m 'build(tactical): ship compiled Battlefield Lab bundle'
            git push origin HEAD:feat/tactical-battlefield-live-test-access-20261019
          fi
