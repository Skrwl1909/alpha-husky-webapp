name: Tactical Field Settlement Recovery P0
on:
  push:
    branches:
      - fix/tactical-field-result-settlement-recovery-p0-20261121
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  settlement-recovery:
    if: github.event_name == 'push' || github.head_ref == 'fix/tactical-field-result-settlement-recovery-p0-20261121' || github.head_ref == 'fix/tactical-survival-settlement-p0-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify field settlement recovery
        run: node tools/verify_tactical_field_settlement_recovery_p0.mjs
      - name: Verify existing result protections
        run: |
          node tools/verify_tactical_story_results_transactions.mjs
          node --test tools/verify_tactical_ops_failure_recording.mjs
      - name: Build tactical runtime
        run: npm run build:tactical-ops
      - name: Check generated runtime syntax
        run: node --check js/tactical_ops.js
      - name: Synchronize generated bundles on isolated branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- js/tactical_ops.js js/boot_loaders.js; then
            echo "Generated bundles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          git commit -m "build(tactical): sync settlement recovery runtime [skip ci]"
          git push origin HEAD:fix/tactical-field-result-settlement-recovery-p0-20261121
