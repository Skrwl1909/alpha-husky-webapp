name: Browser Tactical Exit V1
on:
  pull_request:
    paths:
      - 'tactical-ops-src/host/bootstrap.ts'
      - 'tactical-ops-src/version.ts'
      - 'tools/verify_tactical_browser_exit_browser.mjs'
      - '.github/workflows/browser-tactical-exit.yml'
permissions:
  contents: read
jobs:
  browser-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Browser Guest only — close/resume/safety
        run: node tools/verify_tactical_browser_exit_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Production bundle parity
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
