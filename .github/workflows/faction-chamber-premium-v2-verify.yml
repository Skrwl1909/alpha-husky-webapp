name: Faction Chamber Premium Verify
on:
  push:
    branches: [faction-signal-chamber-premium-assets-v2]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax
        run: node --check js/faction_chamber.js
      - name: Chamber asset contract
        run: |
          test -f images/factions/faction_chamber_neutral.webp
          test -f images/factions/faction_chamber_inner_howl.webp
          test -f images/factions/faction_chamber_rogue_byte.webp
          test -f images/factions/faction_chamber_echo_wardens.webp
          test -f images/factions/faction_chamber_pack_burners.webp
          grep -q 'faction_chamber_neutral.webp' js/faction_chamber.js
          grep -q 'Premium Runtime V1' css/faction_chamber.css
