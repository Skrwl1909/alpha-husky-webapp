name: G2 Branch Canonical Bundle Sync
on:
  push:
    branches:
      - feat/tactical-g2-courier-trace-carryover-20261102
permissions:
  contents: write
jobs:
  bundle:
    if: github.ref == 'refs/heads/feat/tactical-g2-courier-trace-carryover-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build:tactical-ops
      - name: Commit only canonical bundle on G2 branch
        run: |
          if git diff --quiet -- js/tactical_ops.js js/boot_loaders.js; then
            echo "Canonical bundle already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/tactical_ops.js js/boot_loaders.js
          git commit -m "build(tactical): synchronize G2 canonical IIFE and loader"
          git push origin HEAD:feat/tactical-g2-courier-trace-carryover-20261102
