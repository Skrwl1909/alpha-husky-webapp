name: reactive-world-map-p0-verify
on:
  push:
    branches:
      - feature/reactive-world-map-p0-20261001
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check js/map_sections_v2.js
      - name: Reactive map verifier
        run: node tools/verify_reactive_world_map_p0.mjs
      - name: Diff check
        run: git diff --check 9a2f2ce51a8fd5e753e2a2ad14ff6c4225cb823b HEAD
