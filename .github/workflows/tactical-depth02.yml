name: Tactical Depth 02 Plans
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'tools/verify_tactical_depth02*.mjs'
      - 'tools/verify_tactical_depth01_combat.mjs'
      - '.github/workflows/tactical-depth02.yml'
permissions:
  contents: read
jobs:
  plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Frozen plans, checkpoint behavior and real engine traces
        run: |
          node tools/verify_tactical_depth02.mjs
          node tools/verify_tactical_depth02_combat.mjs
          node tools/verify_tactical_depth01.mjs
          node tools/verify_tactical_vnext_run_contract_wire.mjs
      - name: Production bundle parity
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Brief, combat, Results and resume at 320 and 390 pixels
        run: node tools/verify_tactical_depth02_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-depth02-evidence
          path: artifacts/depth02
          if-no-files-found: error
