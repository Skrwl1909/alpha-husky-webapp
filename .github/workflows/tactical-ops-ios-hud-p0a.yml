name: Tactical Ops iOS HUD P0A verify and build
on:
  push:
    branches:
      - fix/tactical-ops-ios-field-hud-p0a-20261016
    paths-ignore:
      - js/tactical_ops.js
      - js/boot_loaders.js
permissions:
  contents: write
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tactical-ops-ios-field-hud-p0a-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/verify_tactical_ops_ios_field_hud.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build:tactical-ops
      - run: node --check js/tactical_ops.js
      - run: node tools/verify_tactical_ops_ios_field_hud.mjs
      - name: Commit production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(tactical): bundle iOS HUD P0A fix [skip ci]"
          git push origin HEAD:fix/tactical-ops-ios-field-hud-p0a-20261016
