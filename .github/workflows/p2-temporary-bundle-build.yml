# Temporary branch-only canonical build worker; remove before merge.
name: P2 temporary canonical Tactical Ops bundle
on:
  push:
    branches:
      - feat/tactical-threat-battlefield-clarity-p2-20261123
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate and commit canonical P2 runtime
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git add -- js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(tactical): canonical P2 runtime bundle'
            git push origin HEAD:feat/tactical-threat-battlefield-clarity-p2-20261123
          fi
