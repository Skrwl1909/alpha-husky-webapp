name: Browser FTUE Oath continuity

on:
  pull_request:
    paths:
      - 'js/ftue_continuity.js'
      - 'js/faction_chamber.js'
      - 'tools/verify_browser_ftue_oath_continuity.mjs'
      - '.github/workflows/browser-ftue-oath-continuity.yml'

permissions:
  contents: read

jobs:
  browser-ftue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser FTUE and Oath continuity
        run: |
          node --check js/ftue_continuity.js
          node --check js/faction_chamber.js
          node --check tools/verify_browser_ftue_oath_continuity.mjs
          node tools/verify_browser_ftue_oath_continuity.mjs
