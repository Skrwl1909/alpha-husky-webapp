name: Tactical Overhead V1 — Build and Verify
on:
  push:
    branches:
      - feat/tactical-overhead-perspective-v1
permissions:
  contents: write
jobs:
  build-and-sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node tools/verify_tactical_overhead_perspective.mjs
      - run: npm run build:tactical-ops
      - run: node tools/verify_tactical_battlefield_p5.mjs
      - run: node tools/verify_tactical_premium_integration.mjs
      - name: Sync canonical production bundle and cache marker on branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync overhead perspective V1 production bundle [skip ci]"
            git push origin HEAD:feat/tactical-overhead-perspective-v1
          fi
