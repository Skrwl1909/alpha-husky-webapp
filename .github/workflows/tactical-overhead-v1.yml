name: Tactical Overhead V1 — Build and Verify
on:
  push:
    branches:
      - feat/tactical-overhead-perspective-v1
permissions:
  contents: write
jobs:
  build-and-sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: node tools/verify_tactical_overhead_perspective.mjs
      - run: node tools/verify_tactical_overhead_arenas.mjs
      - run: npm run build:tactical-ops
      - run: node tools/verify_tactical_battlefield_p5.mjs
      # This PR touches Battle.tsx intentionally; the historical premium
      # integration script asserts byte-for-byte unchanged Battle.tsx and
      # cannot be used as a pass/fail gate for a presentation-camera PR.
      # Exercise the current gameplay/accepted-run contracts instead.
      - run: node tools/verify_tactical_mission_clarity.mjs
      - run: node tools/verify_tactical_vnext_run_contract_wire.mjs
      - run: node tools/verify_tactical_ops_vnext_contract.mjs
      - run: node tools/verify_tactical_battlefield_p5_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: node tools/verify_tactical_mobile_playability.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: node tools/verify_tactical_alpha_directional_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-overhead-v1-browser
          path: |
            artifacts/battlefield-p5
            artifacts/mobile-playability
          if-no-files-found: ignore
      - name: Sync canonical production bundle and cache marker on branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync overhead perspective V1 production bundle [skip ci]"
            git push origin HEAD:feat/tactical-overhead-perspective-v1
          fi
