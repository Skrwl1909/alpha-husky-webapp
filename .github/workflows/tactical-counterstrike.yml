name: Tactical Counterstrike False Relay
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'tools/*counterstrike*'
      - '.github/workflows/tactical-counterstrike.yml'
permissions:
  contents: read
jobs:
  encounter-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Two strategies, Intel and high-level combat
        run: |
          node tools/verify_tactical_counterstrike.mjs
          node tools/build_tactical_counterstrike.mjs
          node tools/verify_tactical_counterstrike_workers.mjs
      - name: Production bundle parity
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Brief to Archive and reload at 320, 390, 430
        run: node tools/verify_tactical_counterstrike_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstrike-combat-and-mobile
          path: artifacts/counterstrike
          if-no-files-found: error
