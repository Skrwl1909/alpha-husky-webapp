name: Tactical v3A canonical build
on:
  push:
    branches:
      - tactical-ops-v3a-rotation-spine
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tactical-ops-v3a-rotation-spine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tactical-ops
      - name: Verify scoped build output
        run: |
          grep -F "tactical_ops.js v3.0.0-rotation-spine" js/tactical_ops.js
          grep -F 'global.WEBAPP_VER = "tops-3.0.0-rotation-spine";' js/boot_loaders.js
          git diff --exit-code -- . ':!js/tactical_ops.js' ':!js/boot_loaders.js' || true
      - name: Commit canonical build and remove temporary workflow
        run: |
          git config user.name "alpha-husky-build"
          git config user.email "actions@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          git rm .github/workflows/tactical-v3a-build.yml
          git commit -m "Tactical Ops v3A: canonical production bundle"
          git push origin HEAD:tactical-ops-v3a-rotation-spine
