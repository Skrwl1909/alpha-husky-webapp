name: PR27 Final Review

on:
  push:
    branches:
      - faction-identity-initiation-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check changed runtime files
        run: |
          node --check js/callsign.js
          node --check js/faction_identity.js
          node --check js/faction_chamber.js
          node --check js/factions.js
          node --check js/faction_hq.js
          node --check js/oath.js
          node --check js/onboarding.js
      - name: Contract assertions
        run: |
          grep -q 'Faction UNBOUND' js/oath.js
          grep -q 'HOLD TO BIND' js/faction_chamber.js
          grep -q 'Enter the Faction Signal' js/faction_hq.js
          grep -q 'return getFactionKeyFromState() || ""' js/factions.js
          ! grep -q 'Choose the pack you fight under before answering your first signal' js/onboarding.js
