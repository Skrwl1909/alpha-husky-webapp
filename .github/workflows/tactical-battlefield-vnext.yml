name: Tactical Battlefield VNext
on:
  pull_request:
    paths:
      - "tactical-ops-src/combat/**"
      - "tactical-ops-src/ui/Battle.tsx"
      - "tactical-ops-src/ui/tacticalCampaignOrders.ts"
      - "tactical-ops-src/data/campaignChapter.ts"
      - "tactical-ops-src/ui/campaignChapter.css"
      - "tools/verify_tactical_s9b_chapter.mjs"
      - "tactical-ops-src/ui/tacticalCampaignOrders.css"
      - "tools/verify_tactical_s9_campaign_orders.mjs"
      - "tools/verify_tactical_battlefield_visual_closure.mjs"
      - "tools/verify_tactical_battlefield_shell_closure.mjs"
      - "tactical-ops-src/ui/combatIdentity.ts"
      - "tactical-ops-src/ui/combatFxAtlas.ts"
      - "tools/verify_tactical_combat_fx.mjs"
      - "images/tactical_ops/combat_fx/v1/**"
      - "tactical-ops-src/ui/actionPresentation.ts"
      - "tactical-ops-src/ui/PackMastery.tsx"
      - "tactical-ops-src/data/packMastery.ts"
      - "tools/verify_tactical_combat_identity.mjs"
      - "tactical-ops-src/ui/App.tsx"
      - "tactical-ops-src/ui/playerGuidance.ts"
      - "tactical-ops-src/ui/missionPurpose.ts"
      - "tools/verify_tactical_s1_purpose_truth.mjs"
      - "tools/verify_tactical_player_clarity.mjs"
      - "tools/verify_tactical_command_deck.mjs"
      - "tactical-ops-src/ui/Skillbook.tsx"
      - "tactical-ops-src/styles.ts"
      - "tactical-ops-src/ui/signalAtlas/**"
      - "tools/verify_tactical_signal_atlas_v2.mjs"
      - "tools/verify_tactical_signal_atlas_p3*.mjs"
      - "docs/TACTICAL_SIGNAL_ATLAS_V2_ENGINEERING_GATE.md"
      - "tactical-ops-src/tactical.css"
      - "tactical-ops-src/ui/combatCohesion.css"
      - "tools/verify_tactical_visual_cohesion.mjs"
      - "tools/verify_tactical_vnext_skillbook_integration.mjs"
      - "tactical-ops-src/data/playerGrowth.ts"
      - "tactical-ops-src/data/signalCodex.ts"
      - "tools/verify_tactical_vnext_step5_squad_codex.mjs"
      - "tools/verify_tactical_vnext_step5_squad_matrix.mjs"
      - "tactical-ops-src/store/battleStore.ts"
      - "tactical-ops-src/host/foundationProgression.ts"
      - "tools/verify_tactical_vnext_run_contract_wire.mjs"
      - "tools/verify_tactical_vnext_player_growth.mjs"
      - "tactical-ops-src/ui/s3AfterAction.ts"
      - "tools/verify_tactical_s3_after_action.mjs"
      - "tactical-ops-src/ui/s3PowerProof.ts"
      - "tools/verify_tactical_s3_power_proof.mjs"
      - "tactical-ops-src/ui/s3CombatProof.ts"
      - "tools/verify_tactical_s3_combat_proof.mjs"
      - "tools/verify_tactical_s3_consequence_chain.mjs"
      - "tools/verify_tactical_battlefield_preview.mjs"
      - ".github/workflows/tactical-battlefield-vnext.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battlefield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node tools/verify_tactical_battlefield_preview.mjs
      - run: node tools/verify_tactical_vnext_combat_intelligence.mjs
      - run: node tools/verify_tactical_vnext_counterplay.mjs
      - run: node tools/verify_tactical_s2_objective_ai.mjs
      - run: node tools/simulate_tactical_s2_full_combat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-s2-full-combat-report
          path: artifacts/tactical-s2-full-combat.json
          if-no-files-found: ignore
      - run: node tools/verify_tactical_vnext_player_growth.mjs
      - run: node tools/verify_tactical_s3_after_action.mjs
      - run: node tools/verify_tactical_s3_power_proof.mjs
      - run: node tools/verify_tactical_s3_combat_proof.mjs
      - run: node tools/verify_tactical_s3_consequence_chain.mjs
      - run: node tools/verify_tactical_vnext_skillbook_integration.mjs
      - run: node tools/verify_tactical_signal_atlas_v2.mjs
      - run: node tools/verify_tactical_signal_atlas_assets_p2.mjs
      - run: node tools/verify_tactical_signal_atlas_p3.mjs
      - run: node tools/verify_tactical_vnext_step5_squad_codex.mjs
      - run: node tools/verify_tactical_vnext_step5_squad_matrix.mjs
      - run: node tools/verify_tactical_command_deck.mjs
      - run: node tools/verify_tactical_combat_identity.mjs
      - run: node tools/verify_tactical_combat_fx.mjs
      - run: node tools/verify_tactical_combat_fx_readability.mjs
      - run: node tools/verify_tactical_combat_fx_identity.mjs
      - run: node tools/verify_tactical_combat_contact.mjs
      - run: node tools/verify_tactical_contact_sync.mjs
      - run: node tools/verify_tactical_hp_impact.mjs
      - run: node tools/verify_tactical_enemy_presentation.mjs
      - run: node tools/verify_tactical_combat_consequences.mjs
      - run: node tools/verify_tactical_visual_cohesion.mjs
      - run: node tools/verify_tactical_s9_campaign_orders.mjs
      - run: node tools/verify_tactical_s9b_chapter.mjs
      - run: node tools/verify_tactical_battlefield_visual_closure.mjs
      - run: node tools/verify_tactical_battlefield_shell_closure.mjs
      - run: node tools/verify_tactical_player_clarity.mjs
      - run: node tools/verify_tactical_s1_purpose_truth.mjs
      - run: node tools/verify_tactical_vnext_run_contract_wire.mjs
      - run: node tools/verify_tactical_vnext_step0_baseline.mjs
      - run: node tools/simulate_tactical_vnext_step0_legacy.mjs
      - run: node tools/benchmark_tactical_vnext_grids.mjs
      - run: npm run build:tactical-ops
      - name: Check committed Tactical production bundle and Telegram cache key
        run: git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tactical-signal-atlas-built-host
          path: |
            js/tactical_ops.js
            js/boot_loaders.js
          if-no-files-found: error

  atlas-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      # The hosted Ubuntu image supplies Chrome and its system dependencies.
      # Avoid an independent browser/apt download before every visual QA run.
      - run: /usr/bin/google-chrome --version
      - run: node tools/verify_tactical_signal_atlas_p3_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-atlas-p3-browser-evidence
          path: artifacts/signal-atlas-p3
          if-no-files-found: ignore
