name: Tactical Battlefield Visual Alignment V1 — Branch Only
on:
  push:
    branches:
      - feat/tactical-battlefield-visual-alignment-20261105
permissions:
  contents: write
jobs:
  build-check-and-sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: node tools/verify_tactical_overhead_perspective.mjs
      - run: node tools/verify_tactical_battlefield_visual_alignment.mjs
      - run: node tools/verify_tactical_overhead_arenas.mjs
      - run: npm run build:tactical-ops
      - run: node tools/verify_tactical_vnext_run_contract_wire.mjs
      - run: node tools/verify_tactical_ops_vnext_contract.mjs
      - run: node tools/verify_tactical_battlefield_p5_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: node tools/verify_tactical_mobile_playability.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battlefield-alignment-v1-evidence
          path: |
            artifacts/battlefield-p5
            artifacts/mobile-playability
          if-no-files-found: ignore
      - name: Sync canonical bundle and cache marker on isolated branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync battlefield visual alignment V1 [skip ci]"
            git push origin HEAD:feat/tactical-battlefield-visual-alignment-20261105
          fi
