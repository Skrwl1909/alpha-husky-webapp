name: Tactical Combat UX Reliability V1
on:
  push:
    branches:
      - fix/tactical-combat-ux-reliability-v1-20261121
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'fix/tactical-combat-ux-reliability-v1-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Focused interaction contracts
        run: node --test tools/verify_tactical_combat_ux_reliability_v1.mjs
      - name: Existing targeting and HUD regressions
        run: |
          node tools/verify_tactical_defeated_tile_hitbox.mjs
          node tools/verify_tactical_ops_ios_field_hud.mjs
          node tools/verify_tactical_contact_sync.mjs
          node tools/verify_tactical_ops_action_icons.mjs
      - name: Build canonical runtime
        run: npm run build:tactical-ops
      - name: Check bundle syntax
        run: node --check js/tactical_ops.js
      - name: Verify available combat and progression regressions
        run: |
          node tools/verify_tactical_battlefield_p5.mjs
          node tools/verify_tactical_ops_foundation.mjs
          node tools/verify_tactical_ops_foundation_persistence.mjs
          node tools/verify_tactical_ops_operation_breach.mjs
          node tools/verify_tactical_ops_operation_recover.mjs
          node tools/verify_tactical_ops_operation_commander.mjs
          node tools/verify_tactical_ops_commander_squad.mjs
          node tools/verify_tactical_ops_evergreen.mjs
          node tools/verify_tactical_mission_clarity.mjs
          node tools/verify_tactical_contact_sync.mjs
          node tools/verify_tactical_recover_authority_client.mjs
          node tools/verify_tactical_last_howl.mjs
      - name: Install browser runner
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Chromium P5 interaction and viewport evidence
        run: node tools/verify_tactical_battlefield_p5_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Upload browser screenshots and measured checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-ux-reliability-chromium
          path: artifacts/battlefield-p5/after
          if-no-files-found: ignore
      - name: Synchronize generated bundles on isolated branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- js/tactical_ops.js js/boot_loaders.js; then
            echo "Generated bundles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          git commit -m "build(tactical): synchronize reliability V1 bundle [skip ci]"
          git push origin HEAD:fix/tactical-combat-ux-reliability-v1-20261121
