name: Tactical Unit Motion V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'tactical-ops-src/**'
      - 'images/tactical_ops/unit_motion/**'
      - 'assets/tactical_motion_sources/**'
      - 'tools/*unit_motion*'
      - 'tools/verify_tactical_alpha_directional_browser.mjs'
      - 'package*.json'
      - '.github/workflows/tactical-unit-motion-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:tactical-ops:unit-motion
      - run: git diff --exit-code -- images/tactical_ops/unit_motion/v1
      - run: npm run build:tactical-ops
      - run: git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - run: node tools/verify_tactical_combat_motion_v1.mjs
      - run: node tools/verify_tactical_enemy_combat_motion_v1.mjs
      - run: node tools/verify_tactical_battlefield_visual_alignment.mjs
      - run: node tools/verify_tactical_combat_fx_identity.mjs
      - run: node tools/verify_tactical_combat_fx_readability.mjs
      - run: npm run verify:tactical-ops:unit-motion
      - run: node tools/verify_tactical_alpha_directional_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-unit-motion-v1
          path: artifacts/unit-motion-v1
