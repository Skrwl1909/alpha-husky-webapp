name: Tactical Contact P3 — isolated release build
on:
  push:
    branches:
      - polish/tactical-combat-contact-p3-20261024
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node tools/verify_tactical_combat_contact.mjs
      - run: npm run build:tactical-ops
      - name: Commit compiled bundle on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(tactical): compile 3.5.10 combat contact"
          git push origin HEAD:polish/tactical-combat-contact-p3-20261024
