name: pack-response-p0-verify
on:
  push:
    branches:
      - feature/pack-response-p0-20261001
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check js/living_world.js
      - name: Frontend verifier
        run: node tools/verify_actionable_frontline_echo_p0_recovery.mjs
      - name: Diff check
        run: |
          git fetch origin b321faecc32bffa1c044016d33e0c7470d1cd37f
          git diff --check FETCH_HEAD HEAD
