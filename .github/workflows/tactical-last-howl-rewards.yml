name: Last Howl reward receipts
on:
  pull_request:
    paths:
      - 'tactical-ops-src/ui/LastHowl.tsx'
      - 'tactical-ops-src/ui/lastHowlRewards.tsx'
      - 'tactical-ops-src/ui/lastHowl.css'
      - 'tools/verify_tactical_last_howl_rewards.mjs'
      - '.github/workflows/tactical-last-howl-rewards.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:tactical-ops
      - run: node tools/verify_tactical_last_howl_rewards.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-howl-rewards-mobile
          path: artifacts/last-howl-rewards
