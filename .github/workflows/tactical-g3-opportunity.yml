name: Tactical G3 Progression Opportunity
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'js/boot_loaders.js'
      - 'tools/verify_tactical_g3*.mjs'
      - '.github/workflows/tactical-g3-opportunity.yml'
permissions:
  contents: read
jobs:
  opportunity-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Opportunities, receipt truth and accepted-run compatibility
        run: |
          node tools/verify_tactical_g3_opportunity.mjs
          node tools/verify_tactical_purpose_return.mjs
          node tools/verify_tactical_s1_purpose_truth.mjs
          node tools/verify_tactical_s3_after_action.mjs
          node tools/verify_tactical_ops_failure_recording.mjs
          node tools/verify_tactical_vnext_run_contract_wire.mjs
      - name: Canonical production bundle parity
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Mobile opportunity and result flow
        run: node tools/verify_tactical_g3_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-g3-evidence
          path: artifacts/g3
