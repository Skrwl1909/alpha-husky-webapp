# Temporary branch-only canonical release builder, removed before merge.
name: P1 temporary canonical bundle build
on:
  push:
    branches:
      - feat/tactical-premium-game-feel-p1-20261123
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Rebuild canonical Tactical Ops bundle and loader
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git add -- js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(tactical): sync canonical P1 runtime'
            git push origin HEAD:feat/tactical-premium-game-feel-p1-20261123
          fi
