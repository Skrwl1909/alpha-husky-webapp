name: Tactical Player Purpose and Return
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'tools/verify_tactical_purpose_return*.mjs'
      - '.github/workflows/tactical-purpose-return.yml'
permissions:
  contents: read
jobs:
  purpose-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Purpose, truth, objectives, persistence and accepted contracts
        run: |
          node tools/verify_tactical_command_next_purpose.mjs
          node tools/verify_tactical_purpose_return.mjs
          node tools/verify_tactical_s1_purpose_truth.mjs
          node tools/verify_tactical_s2_objective_ai.mjs
          node tools/verify_tactical_s3_after_action.mjs
          node tools/verify_tactical_s3_consequence_chain.mjs
          node tools/verify_tactical_s3_power_proof.mjs
          node tools/verify_tactical_g1_transactions.mjs
          node tools/verify_tactical_ops_vnext_contract.mjs
          node tools/verify_tactical_vnext_run_contract_wire.mjs
          node tools/verify_tactical_recover_authority_client.mjs
      - name: Verify the pinned RECOVER worker and both M2 workers
        run: |
          mkdir -p artifacts/legacy-recover
          git archive 2fdb990846840a997f36a49a176b6f848463a46d tactical-ops-src tools/build_tactical_recover_engine_v1.mjs tools/tactical_recover_engine_v1.ts | tar -x -C artifacts/legacy-recover
          node artifacts/legacy-recover/tools/build_tactical_recover_engine_v1.mjs
          echo "13568770cba259bcee808d03794e0e260a8d8c82ba5e87d630bd82100aaf78a0  artifacts/legacy-recover/artifacts/recover-authority-v1/tactical_recover_engine_v1.cjs" | sha256sum --check
          mkdir -p artifacts/legacy-m2
          git archive 5818ea1bcc45f6f36e32ac937bf9589d560211bb tactical-ops-src tools/build_tactical_m2_workers.mjs tools/tactical_recover_engine_v1.ts tools/tactical_last_howl_engine_v11.ts | tar -x -C artifacts/legacy-m2
          node artifacts/legacy-m2/tools/build_tactical_m2_workers.mjs artifacts/tactical-m2-workers
          sha256sum --check <<'EOF'
          94bb393f30e7832edf33233563b5895fb547dfe718dfe687bb7d1e5b7c07ecff  artifacts/tactical-m2-workers/tactical_recover_engine_m2.cjs
          a984afefece5fcd59f4cf6c8bbe34e9049b1901b1ac1641de9a54dfca7b458dd  artifacts/tactical-m2-workers/tactical_last_howl_engine_m2.cjs
          EOF
          TACTICAL_M2_WORKERS=artifacts/tactical-m2-workers node tools/verify_tactical_m2_wide_lunge.mjs
      - name: Next decision at 320, 390, 430 and desktop
        run: NEXT_DECISION_ONLY=1 node tools/verify_tactical_purpose_return_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Production bundle parity
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Reproduce baseline screenshots from merged PR 211
        run: |
          mkdir -p artifacts/baseline
          git archive 8db3528a2b672a373505080f80704d3c1f646025 tactical-ops-src | tar -x -C artifacts/baseline
          PURPOSE_PHASE=before node tools/verify_tactical_purpose_return_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Current purpose and mobile battles
        run: |
          node tools/verify_tactical_purpose_return_browser.mjs
          MOBILE_OUT=artifacts/purpose-return/battle node tools/verify_tactical_mobile_playability.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-purpose-return-evidence
          path: |
            artifacts/purpose-return
            artifacts/next-decision
          if-no-files-found: warn
