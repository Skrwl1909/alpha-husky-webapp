name: Tactical Player Purpose and Return
on:
  pull_request:
    paths:
      - 'tactical-ops-src/**'
      - 'js/tactical_ops.js'
      - 'tools/verify_tactical_purpose_return*.mjs'
      - '.github/workflows/tactical-purpose-return.yml'
permissions:
  contents: read
jobs:
  purpose-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Purpose, truth, objectives, persistence and accepted contracts
        run: |
          node tools/verify_tactical_purpose_return.mjs
          node tools/verify_tactical_s1_purpose_truth.mjs
          node tools/verify_tactical_s2_objective_ai.mjs
          node tools/verify_tactical_s3_after_action.mjs
          node tools/verify_tactical_s3_consequence_chain.mjs
          node tools/verify_tactical_s3_power_proof.mjs
          node tools/verify_tactical_g1_transactions.mjs
          node tools/verify_tactical_ops_vnext_contract.mjs
          node tools/verify_tactical_vnext_run_contract_wire.mjs
      - name: Production bundle parity
        run: |
          npm run build:tactical-ops
          node --check js/tactical_ops.js
          git diff --exit-code -- js/tactical_ops.js js/boot_loaders.js
      - name: Reproduce baseline screenshots from merged PR 211
        run: |
          mkdir -p artifacts/baseline
          git archive 8db3528a2b672a373505080f80704d3c1f646025 tactical-ops-src | tar -x -C artifacts/baseline
          PURPOSE_PHASE=before node tools/verify_tactical_purpose_return_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - name: Current purpose and mobile battles
        run: |
          node tools/verify_tactical_purpose_return_browser.mjs
          MOBILE_OUT=artifacts/purpose-return/battle node tools/verify_tactical_mobile_playability.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-purpose-return-evidence
          path: artifacts/purpose-return
          if-no-files-found: warn
