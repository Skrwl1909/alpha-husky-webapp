name: Tactical HOUND Directional V1 — Build and Browser
on:
  push:
    branches:
      - feat/tactical-hound-directional-v1
permissions:
  contents: write
jobs:
  verify-and-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: node tools/verify_tactical_hound_directional.mjs
      - run: node tools/verify_tactical_overhead_arenas.mjs
      - run: node tools/verify_tactical_overhead_perspective.mjs
      - run: npm run build:tactical-ops
      - run: node tools/verify_tactical_battlefield_p5.mjs
      - run: node tools/verify_tactical_vnext_run_contract_wire.mjs
      - run: node tools/verify_tactical_ops_vnext_contract.mjs
      - run: node tools/verify_tactical_battlefield_p5_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: node tools/verify_tactical_mobile_playability.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - run: node tools/verify_tactical_alpha_directional_browser.mjs
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-hound-v1-browser
          path: |
            artifacts/battlefield-p5
            artifacts/mobile-playability
          if-no-files-found: ignore
      - name: Sync exact production bundle on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tactical_ops.js js/boot_loaders.js
          if ! git diff --cached --quiet; then
            git commit -m "build(tactical): sync directional HOUND runtime [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin feat/tactical-hound-directional-v1
              git rebase origin/feat/tactical-hound-directional-v1
              if git push origin HEAD:feat/tactical-hound-directional-v1; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
